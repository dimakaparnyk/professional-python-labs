[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-service"
version = "1.0.0"
description = "Persistent computer equipment inventory with REST API, variant 13"
authors = [{name = "Капарник Дмитро Андрійович"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "SQLAlchemy>=2.0,<3", "fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.30,<1", "numpy>=2,<3"]

[project.scripts]
computer-inventory = "computer_inventory.main:main"
inventory-service = "inventory_service.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]
dev = ["ruff>=0.12,<1", "mypy>=1.11,<3", "types-PyYAML", "build>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
mypy_path = "src"

[tool.setuptools.package-data]
computer_inventory = ["py.typed"]
inventory_service = ["py.typed"]
