[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-inventory"
version = "0.1.0"
description = "Computer equipment inventory - Professional Python, variant 13"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "SQLAlchemy>=2.0,<3"]

[project.scripts]
computer-inventory = "computer_inventory.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
